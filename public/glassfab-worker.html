<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060c14">
<script src="/agi-api.js"></script>
<title>AGI Glass — Worker</title>
<style>
:root{
  --bg:#060c14; --s1:#0b1522; --s2:#101d2c; --s3:#162436;
  --br:#1a2e45; --br2:#213650;
  --a:#00ccff; --a2:#ff6935; --a3:#36ff8a; --a4:#ffd23f; --a5:#c084fc;
  --tx:#d0e8f5; --tx2:#6a90b0; --mu:#3a5268;
  --r:12px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;color:var(--tx);display:flex;flex-direction:column}

/* ── SCREENS ── */
.screen{display:none;flex-direction:column;height:100%;overflow:hidden}
.screen.on{display:flex}

/* ── LOGIN ── */
#scr-login{background:var(--bg);align-items:center;justify-content:center;padding:40px 24px;
  background-image:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(0,204,255,.07),transparent)}
.login-logo{width:72px;height:72px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;border-radius:8px;overflow:hidden}
.login-title{font-size:1.8rem;font-weight:700;letter-spacing:2px;text-align:center;color:var(--a);
  font-variant:small-caps;margin-bottom:4px}
.login-sub{font-size:.75rem;color:var(--tx2);text-align:center;margin-bottom:36px;letter-spacing:1px}
.login-box{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.inp{background:var(--s2);border:1.5px solid var(--br);border-radius:var(--r);
  color:var(--tx);font-size:1rem;padding:14px 16px;outline:none;width:100%;
  transition:border-color .2s;-webkit-appearance:none}
.inp:focus{border-color:var(--a)}
.inp::placeholder{color:var(--mu)}
.inp.err{border-color:#ff5a5a;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn-full{width:100%;padding:16px;background:var(--a);border:none;border-radius:var(--r);
  color:#000;font-size:1rem;font-weight:700;cursor:pointer;letter-spacing:1px;
  transition:all .2s;-webkit-appearance:none}
.btn-full:active{transform:scale(.97);background:#00aadd}
.login-err{color:#ff6464;font-size:.82rem;text-align:center;min-height:18px;letter-spacing:.3px}

/* ── TOP BAR ── */
.topbar{background:rgba(6,12,20,.95);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--br);padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:10}
.topbar-brand{font-size:.75rem;font-weight:700;letter-spacing:2px;color:var(--a);text-transform:uppercase}
.topbar-worker{font-size:.72rem;color:var(--tx2);margin-left:auto}
.topbar-logout{background:none;border:1px solid var(--br);color:var(--mu);
  padding:5px 10px;border-radius:8px;font-size:.65rem;cursor:pointer;letter-spacing:.5px}
.topbar-logout:active{color:var(--a2);border-color:var(--a2)}

/* ── SCROLL BODY ── */
.scroll-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px;
  padding-bottom:calc(24px + var(--safe-b))}

/* ── CARDS ── */
.card{background:var(--s2);border:1px solid var(--br);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.card-hd{background:var(--s1);padding:11px 14px;border-bottom:1px solid var(--br);
  display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--tx2);font-weight:600}
.card-body{padding:14px}

/* ── HOME TAB ── */
.home-logo{display:flex;justify-content:center;padding:28px 0 16px}
.home-logo img{width:90px;height:90px;border-radius:16px;object-fit:contain}
.home-greeting{text-align:center;margin-bottom:20px}
.home-greeting h2{font-size:1.3rem;font-weight:700;color:var(--tx);letter-spacing:.5px}
.home-greeting p{font-size:.78rem;color:var(--tx2);margin-top:4px}
.status-badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:20px;font-size:.72rem;font-weight:600;margin-top:8px}
.status-in{background:rgba(54,255,138,.12);border:1px solid rgba(54,255,138,.3);color:var(--a3)}
.status-out{background:rgba(255,90,90,.08);border:1px solid rgba(255,90,90,.3);color:#ff6464}
.status-none{background:rgba(106,144,176,.1);border:1px solid var(--br);color:var(--tx2)}
.quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.quick-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:6px;padding:18px 10px;border-radius:var(--r);border:1.5px solid;cursor:pointer;
  font-size:.78rem;font-weight:600;letter-spacing:.3px;transition:all .15s;-webkit-appearance:none}
.quick-btn .qbi{font-size:1.5rem}
.quick-btn-primary{background:var(--a);border-color:var(--a);color:#000}
.quick-btn-primary:active{background:#00aadd}
.quick-btn-secondary{background:var(--s2);border-color:var(--br);color:var(--tx)}
.quick-btn-secondary:active{border-color:var(--a);color:var(--a)}

/* ── ATTENDANCE TAB ── */
.att-btn{padding:12px 8px;border-radius:10px;border:1.5px solid;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .2s;-webkit-appearance:none;text-align:center}
.att-in{background:rgba(54,255,138,.08);border-color:var(--a3);color:var(--a3)}
.att-in:active{background:rgba(54,255,138,.2)}
.att-out{background:rgba(255,90,90,.08);border-color:#ff5a5a;color:#ff6464}
.att-out:active{background:rgba(255,90,90,.2)}
.att-btn:disabled{opacity:.4;cursor:default}
.att-row{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--br)}
.att-row:last-child{border-bottom:none}
.att-label{font-size:.68rem;color:var(--tx2);letter-spacing:.5px;text-transform:uppercase}
.att-value{font-size:.9rem;font-weight:600;font-family:monospace;color:var(--tx)}

/* ── SCANNER VIEW ── */
#scr-scan .topbar{background:rgba(6,12,20,.97)}
.scan-hero{display:flex;flex-direction:column;align-items:center;padding:24px 16px 16px}
.scan-frame{width:220px;height:220px;border-radius:20px;position:relative;margin-bottom:20px;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.scan-frame video{width:100%;height:100%;object-fit:cover;border-radius:16px}
.scan-frame canvas{display:none}
.scan-corners{position:absolute;inset:0;pointer-events:none}
.sc-corner{position:absolute;width:26px;height:26px;border-color:var(--a);border-style:solid;border-width:0}
.sc-corner.tl{top:8px;left:8px;border-top-width:3px;border-left-width:3px;border-radius:6px 0 0 0}
.sc-corner.tr{top:8px;right:8px;border-top-width:3px;border-right-width:3px;border-radius:0 6px 0 0}
.sc-corner.bl{bottom:8px;left:8px;border-bottom-width:3px;border-left-width:3px;border-radius:0 0 0 6px}
.sc-corner.br{bottom:8px;right:8px;border-bottom-width:3px;border-right-width:3px;border-radius:0 0 6px 0}
.scan-line{position:absolute;left:12px;right:12px;height:2px;background:linear-gradient(90deg,transparent,var(--a),transparent);
  animation:scanline 2s ease-in-out infinite;border-radius:1px;box-shadow:0 0 8px var(--a)}
@keyframes scanline{0%,100%{top:12px;opacity:.6}50%{top:calc(100% - 14px);opacity:1}}
.scan-status{font-size:.78rem;color:var(--tx2);letter-spacing:.5px;text-align:center;margin-bottom:8px;min-height:20px}
.scan-status.ok{color:var(--a3)}
.scan-status.err{color:var(--a2)}
.manual-input-row{display:flex;gap:8px;padding:0 16px 16px}
.manual-input-row .inp{flex:1;font-size:.9rem;padding:12px 14px}
.btn-scan-manual{background:var(--s3);border:1.5px solid var(--br2);color:var(--tx2);
  padding:12px 14px;border-radius:var(--r);font-size:.8rem;cursor:pointer;white-space:nowrap;
  letter-spacing:.5px}
.btn-scan-manual:active{border-color:var(--a);color:var(--a)}

/* ── PIECE RESULT CARD ── */
.piece-card{background:var(--s2);border:1.5px solid var(--br);border-radius:var(--r);
  margin:0 16px 16px;overflow:hidden}
.piece-card.highlight{border-color:var(--a3);box-shadow:0 0 20px rgba(54,255,138,.15);
  animation:popIn .3s ease}
@keyframes popIn{0%{transform:scale(.95);opacity:.5}100%{transform:scale(1);opacity:1}}
.piece-hd{padding:14px 16px;background:var(--s1);border-bottom:1px solid var(--br);
  display:flex;align-items:flex-start;gap:12px}
.piece-uid{font-size:1.2rem;font-weight:700;color:var(--a);letter-spacing:.5px}
.piece-order{font-size:.72rem;color:var(--tx2);margin-top:3px}
.piece-dims{font-size:.85rem;color:var(--a4);margin-top:2px;font-variant-numeric:tabular-nums}
.piece-meta{display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:1px solid var(--br)}
.piece-meta-item{padding:10px 14px;border-right:1px solid var(--br)}
.piece-meta-item:nth-child(even){border-right:none}
.piece-meta-label{font-size:.6rem;color:var(--mu);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px}
.piece-meta-val{font-size:.85rem;font-variant-numeric:tabular-nums;font-weight:500}

/* ── PROCESS ROWS ── */
.proc-list{padding:10px 0}
.proc-row{display:flex;align-items:center;padding:12px 16px;gap:12px;border-bottom:1px solid var(--br);
  transition:background .15s}
.proc-row:last-child{border-bottom:none}
.proc-row.done-row{opacity:.6}
.proc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.proc-name{flex:1;font-size:.88rem;font-weight:500}
.proc-time{font-size:.65rem;color:var(--mu);text-align:right;min-width:64px}
.proc-btn{padding:8px 14px;border-radius:10px;border:1.5px solid;font-size:.72rem;
  font-weight:600;cursor:pointer;letter-spacing:.5px;transition:all .18s;white-space:nowrap}
.proc-btn-done{background:rgba(54,255,138,.08);border-color:var(--a3);color:var(--a3)}
.proc-btn-done:active{background:rgba(54,255,138,.2);transform:scale(.95)}

/* ── HISTORY ── */
.hist-item{padding:12px 16px;border-bottom:1px solid var(--br);display:flex;align-items:center;gap:10px}
.hist-item:last-child{border-bottom:none}
.hist-uid{font-size:.85rem;font-weight:600;color:var(--a);min-width:90px}
.hist-proc{font-size:.75rem;color:var(--tx2);flex:1}
.hist-action{font-size:.65rem;padding:2px 8px;border-radius:8px;white-space:nowrap}
.hist-action.start{background:rgba(0,204,255,.1);color:var(--a)}
.hist-action.done{background:rgba(54,255,138,.1);color:var(--a3)}
.hist-time{font-size:.62rem;color:var(--tx2);text-align:right;min-width:70px;font-family:monospace}
.hist-date-header{padding:6px 16px;font-size:.6rem;letter-spacing:1.5px;text-transform:uppercase;
  color:var(--mu);background:var(--s1);border-bottom:1px solid var(--br)}
.hist-filter-row{display:flex;gap:6px;padding:10px 16px;border-bottom:1px solid var(--br)}
.hist-filter-btn{padding:5px 12px;border-radius:20px;border:1px solid var(--br);background:none;
  color:var(--tx2);font-size:.68rem;cursor:pointer;transition:all .15s}
.hist-filter-btn.on{background:var(--a);border-color:var(--a);color:#000;font-weight:700}

/* ── QUEUE ── */
.queue-filter-row{display:flex;gap:8px;padding:12px 16px;border-bottom:1px solid var(--br);
  overflow-x:auto;-webkit-overflow-scrolling:touch;flex-shrink:0}
.queue-filter-btn{white-space:nowrap;padding:6px 14px;border-radius:20px;border:1px solid var(--br);
  background:none;color:var(--tx2);font-size:.72rem;cursor:pointer;transition:all .15s;flex-shrink:0}
.queue-filter-btn.on{background:var(--a);border-color:var(--a);color:#000;font-weight:700}

/* ── BOTTOM NAV ── */
.bottom-nav{background:rgba(6,12,20,.97);border-top:1px solid var(--br);
  display:flex;padding:0;padding-bottom:var(--safe-b);flex-shrink:0}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 0;cursor:pointer;border:none;background:none;color:var(--mu);
  font-size:.55rem;letter-spacing:.8px;text-transform:uppercase;gap:4px;transition:color .15s}
.bn .bni{font-size:1.2rem}
.bn.on{color:var(--a)}
.bn:active{color:var(--tx2)}

/* ── SUCCESS FLASH ── */
.flash-overlay{display:none;position:fixed;inset:0;z-index:500;
  align-items:center;justify-content:center;flex-direction:column;gap:12px;
  background:rgba(6,12,20,.92)}
.flash-overlay.on{display:flex;animation:flashIn .25s ease}
@keyframes flashIn{0%{opacity:0}100%{opacity:1}}
.flash-icon{font-size:5rem;animation:bounce .4s ease}
@keyframes bounce{0%{transform:scale(.5)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.flash-msg{font-size:1.1rem;font-weight:600;color:var(--tx);letter-spacing:.5px;text-align:center}
.flash-sub{font-size:.8rem;color:var(--tx2);text-align:center}

/* ── CHIPS ── */
.chip{display:inline-flex;align-items:center;padding:3px 8px;border-radius:10px;
  font-size:.62rem;font-weight:600;letter-spacing:.5px;border:1px solid}
.pc-cutting{border-color:rgba(0,204,255,.35);color:var(--a);background:rgba(0,204,255,.08)}
.pc-arrising{border-color:rgba(54,255,138,.35);color:var(--a3);background:rgba(54,255,138,.08)}
.pc-flatpolish{border-color:rgba(54,255,138,.35);color:var(--a3);background:rgba(54,255,138,.08)}
.pc-roundpolish{border-color:rgba(54,255,138,.35);color:var(--a3);background:rgba(54,255,138,.08)}
.pc-bevel{border-color:rgba(54,255,138,.35);color:var(--a3);background:rgba(54,255,138,.08)}
.pc-drilling{border-color:rgba(255,210,63,.35);color:var(--a4);background:rgba(255,210,63,.08)}
.pc-tempering{border-color:rgba(255,105,53,.35);color:var(--a2);background:rgba(255,105,53,.08)}
.pc-laminating{border-color:rgba(192,132,252,.35);color:var(--a5);background:rgba(192,132,252,.08)}
.pc-paint{border-color:rgba(255,105,53,.35);color:var(--a2);background:rgba(255,105,53,.08)}
.pc-sandblasting{border-color:rgba(255,210,63,.35);color:var(--a4);background:rgba(255,210,63,.08)}
.pc-poly{border-color:rgba(192,132,252,.35);color:var(--a5);background:rgba(192,132,252,.08)}
.pc-igu{border-color:rgba(0,204,255,.35);color:var(--a);background:rgba(0,204,255,.08)}

/* ── UTILS ── */
.mn{font-variant-numeric:tabular-nums}
.empty-msg{text-align:center;padding:40px 20px;color:var(--mu);font-size:.82rem;line-height:1.8}
</style>
</head>
<body>

<!-- ══════════════════════════════════════════════════════ -->
<!-- SCREEN: LOGIN -->
<!-- ══════════════════════════════════════════════════════ -->
<div class="screen on" id="scr-login">
  <div class="login-logo"><img src="/agi-logo.png" onerror="this.style.display='none';this.parentElement.innerHTML='<div style=\'width:72px;height:72px;background:var(--a);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:1.6rem;font-weight:900;color:#000\'>AGI</div>'"></div>
  <div class="login-title">AGI Glass</div>
  <div class="login-sub">WORKER PORTAL</div>
  <div class="login-box">
    <input class="inp" type="email" id="l-email" placeholder="worker@factory.com" autocomplete="email" inputmode="email">
    <input class="inp" type="password" id="l-pass" placeholder="Password" autocomplete="current-password">
    <div class="login-err" id="l-err"></div>
    <button class="btn-full" onclick="doLogin()">Sign In</button>
  </div>
</div>

<!-- ══════════════════════════════════════════════════════ -->
<!-- SCREEN: HOME -->
<!-- ══════════════════════════════════════════════════════ -->
<div class="screen" id="scr-home">
  <div class="topbar">
    <div class="topbar-brand">AGI Glass</div>
    <div class="topbar-worker" id="wn-home"></div>
    <button class="topbar-logout" onclick="doLogout()">Logout</button>
  </div>
  <div class="scroll-body">
    <!-- Logo -->
    <div class="home-logo">
      <img src="/agi-logo.png" onerror="this.outerHTML='<div style=\'width:90px;height:90px;background:var(--a);border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:900;color:#000\'>AGI</div>'">
    </div>
    <!-- Greeting -->
    <div class="home-greeting">
      <h2 id="home-name">Welcome</h2>
      <p id="home-date"></p>
      <div id="home-status-badge" class="status-badge status-none">&#9643; Not checked in</div>
    </div>
    <!-- Today's times summary -->
    <div class="card" id="home-times-card" style="display:none">
      <div class="card-hd"><span class="card-title">Today</span></div>
      <div class="card-body" style="padding:0">
        <div class="att-row" style="padding:10px 14px">
          <span class="att-label">Punch In</span>
          <span class="att-value" id="home-punch-in">—</span>
        </div>
        <div class="att-row" style="padding:10px 14px">
          <span class="att-label">Punch Out</span>
          <span class="att-value" id="home-punch-out">—</span>
        </div>
        <div class="att-row" style="padding:10px 14px;border:none">
          <span class="att-label">Hours</span>
          <span class="att-value" id="home-hours">—</span>
        </div>
      </div>
    </div>
    <!-- Quick actions -->
    <div class="quick-grid">
      <button class="quick-btn quick-btn-primary" onclick="switchTab('scan')">
        <span class="qbi">&#9906;</span>Scan QR
      </button>
      <button class="quick-btn quick-btn-secondary" onclick="switchTab('queue')">
        <span class="qbi">&#9741;</span>My Queue
      </button>
      <button class="quick-btn quick-btn-secondary" onclick="switchTab('attendance')">
        <span class="qbi">&#9654;</span>Attendance
      </button>
      <button class="quick-btn quick-btn-secondary" onclick="switchTab('history')">
        <span class="qbi">&#128203;</span>History
      </button>
    </div>
  </div>
  <nav class="bottom-nav">
    <button class="bn on" id="bnh-home" onclick="switchTab('home')"><span class="bni">&#8962;</span>Home</button>
    <button class="bn" id="bnh-att" onclick="switchTab('attendance')"><span class="bni">&#128336;</span>Attend</button>
    <button class="bn" id="bnh-scan" onclick="switchTab('scan')"><span class="bni">&#9906;</span>Scan</button>
    <button class="bn" id="bnh-queue" onclick="switchTab('queue')"><span class="bni">&#9741;</span>Queue</button>
    <button class="bn" id="bnh-hist" onclick="switchTab('history')"><span class="bni">&#128203;</span>History</button>
  </nav>
</div>

<!-- ══════════════════════════════════════════════════════ -->
<!-- SCREEN: ATTENDANCE -->
<!-- ══════════════════════════════════════════════════════ -->
<div class="screen" id="scr-attendance">
  <div class="topbar">
    <div class="topbar-brand">Attendance</div>
    <div class="topbar-worker" id="wn-att"></div>
    <button class="topbar-logout" onclick="doLogout()">Logout</button>
  </div>
  <div class="scroll-body">
    <!-- Status & punch buttons -->
    <div class="card">
      <div class="card-hd"><span class="card-title">&#9654; Today's Attendance</span></div>
      <div class="card-body">
        <div id="att-status-row" style="font-size:1rem;font-weight:600;margin-bottom:14px;color:var(--tx)">Loading...</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px">
          <button id="btn-punch-in" class="att-btn att-in" onclick="doPunchIn()" disabled>&#9654; Punch In</button>
          <button id="btn-punch-out" class="att-btn att-out" onclick="doPunchOut()" disabled>&#9632; Punch Out</button>
        </div>
        <div id="att-times" style="font-size:.78rem;color:var(--tx2);line-height:2"></div>
      </div>
    </div>
    <!-- Leave & OT requests -->
    <div class="card">
      <div class="card-hd"><span class="card-title">Requests</span></div>
      <div class="card-body" style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button onclick="openLeaveModal()" style="padding:14px 10px;background:rgba(255,210,63,.08);border:1.5px solid rgba(255,210,63,.3);border-radius:10px;color:var(--a4);font-size:.8rem;font-weight:600;cursor:pointer">
          &#9992; Leave Request
        </button>
        <button onclick="openOTModal()" style="padding:14px 10px;background:rgba(0,204,255,.08);border:1.5px solid rgba(0,204,255,.3);border-radius:10px;color:var(--a);font-size:.8rem;font-weight:600;cursor:pointer">
          &#8987; Log Overtime
        </button>
      </div>
    </div>
  </div>
  <nav class="bottom-nav">

<script>
// ════════════════════════════════════════════════════════
// PROCESS DEFINITIONS
// ════════════════════════════════════════════════════════
const PROC_MAP = {
  cutting:     {label:'Cutting',      cls:'pc-cutting'},
  arrising:    {label:'Arrising',     cls:'pc-arrising'},
  flatpolish:  {label:'Flat Polish',  cls:'pc-flatpolish'},
  roundpolish: {label:'Round Polish', cls:'pc-roundpolish'},
  bevel:       {label:'Bevelling',    cls:'pc-bevel'},
  drilling:    {label:'Drilling',     cls:'pc-drilling'},
  tempering:   {label:'Tempering',    cls:'pc-tempering'},
  laminating:  {label:'Laminating',   cls:'pc-laminating'},
  paint:       {label:'Paint',        cls:'pc-paint'},
  sandblasting:{label:'Sand Blasting',cls:'pc-sandblasting'},
  poly:        {label:'Poly',         cls:'pc-poly'},
  igu:         {label:'IGU',          cls:'pc-igu'},
};
const procLabel = pid => (PROC_MAP[pid]||{label:pid}).label;
const procCls   = pid => (PROC_MAP[pid]||{cls:'pc-cutting'}).cls;

// ════════════════════════════════════════════════════════
// STATE
// ════════════════════════════════════════════════════════
let workers    = [];
let labelItems = [];
let scanLog    = [];
let orders     = [];
let customers  = [];
let currentWorker = null;
let histFilter   = 'today';
let queueFilter  = 'all';
let allQueueData = [];
let _attachments = [];   // order attachments for current piece
let _currentAtt  = null; // attachment open in viewer

// ════════════════════════════════════════════════════════
// AUTH
// ════════════════════════════════════════════════════════
async function doLogin(){
  const email = document.getElementById('l-email').value.trim().toLowerCase();
  const pass  = document.getElementById('l-pass').value;
  const errEl = document.getElementById('l-err');
  errEl.textContent = '';
  if(!email||!pass){ errEl.textContent='Enter email and password.'; return; }
  try{
    const worker = await AGI.Auth.login(email,pass);
    currentWorker = worker;
    sessionStorage.setItem('gfw_session',JSON.stringify({id:worker.id,ts:Date.now()}));
    await startSession();
  }catch(e){
    errEl.textContent = e.message||'Login failed';
    ['l-email','l-pass'].forEach(id=>{
      const el=document.getElementById(id); el.classList.add('err');
      setTimeout(()=>el.classList.remove('err'),1500);
    });
  }
}

function doLogout(){
  sessionStorage.removeItem('gfw_session');
  AGI.Auth.logout();
  currentWorker = null;
  stopCamera();
  showScreen('login');
  document.getElementById('l-pass').value='';
  document.getElementById('l-err').textContent='';
}

async function restoreSession(){
  try{
    const s = JSON.parse(sessionStorage.getItem('gfw_session')||'null');
    if(!s) return false;
    if(Date.now()-s.ts > 12*60*60*1000){ sessionStorage.removeItem('gfw_session'); return false; }
    if(!AGI.getToken()) return false;
    const res = await AGI.Auth.me();
    currentWorker = res.worker;
    return true;
  }catch{ return false; }
}

async function startSession(){
  try{
    [labelItems,workers] = await Promise.all([AGI.Labels.list(),AGI.Workers.list()]);
    AGI.Orders.list().then(list=>Promise.all(list.map(o=>AGI.Orders.get(o.id)))).then(full=>{ orders=full; }).catch(()=>{});
    AGI.Customers.list().then(list=>{ customers=list; }).catch(()=>{});
  }catch(e){ console.warn('[startSession]',e.message); }
  // Update all worker name spans
  ['wn-home','wn-att','wn-scan','wn-queue','wn-hist'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.textContent=currentWorker.name;
  });
  // Home greeting
  const nameEl=document.getElementById('home-name');
  if(nameEl) nameEl.textContent='Hello, '+currentWorker.name.split(' ')[0];
  const dateEl=document.getElementById('home-date');
  if(dateEl) dateEl.textContent=new Date().toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long'});
  showScreen('home');
  switchTab('home');
}

// ════════════════════════════════════════════════════════
// NAVIGATION
// ════════════════════════════════════════════════════════
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById('scr-'+id).classList.add('on');
}

function switchTab(tab){
  stopCamera();
  ['home','attendance','scan','queue','history'].forEach(t=>{
    const s=document.getElementById('scr-'+t); if(s) s.classList.remove('on');
  });
  const target=document.getElementById('scr-'+tab);
  if(target) target.classList.add('on');
  // Update ALL nav buttons (prefix-agnostic)
  document.querySelectorAll('.bn').forEach(btn=>{
    const id=btn.id||'';
    // Extract tab name from id like bnh-home, bna-att, bns-scan, etc.
    const parts = id.split('-'); const btnTab = parts.slice(1).join('-');
    // Map short names back to tab names
    const tabMap = {home:'home',att:'attendance',scan:'scan',queue:'queue',hist:'history'};
    btn.classList.toggle('on', tabMap[btnTab]===tab || btnTab===tab);
  });
  if(tab==='scan')       startCamera();
  if(tab==='history')    renderHistory();
  if(tab==='queue')      renderQueue();
  if(tab==='attendance') loadAttendance();
  if(tab==='home')       loadHomeStatus();
}

// ════════════════════════════════════════════════════════
// FLASH / TOAST
// ════════════════════════════════════════════════════════
function showFlash(icon,title,sub,color){
  const el=document.getElementById('flash');
  document.getElementById('flash-icon').innerHTML=icon;
  document.getElementById('flash-msg').textContent=title;
  document.getElementById('flash-sub').textContent=sub||'';
  el.style.borderTop='3px solid '+(color||'var(--a3)');
  el.classList.add('on');
  setTimeout(()=>el.classList.remove('on'),1800);
}
function showToast(msg){ showFlash('&#9632;','',msg,'var(--a)'); }
function vibrate(p){ try{if(navigator.vibrate)navigator.vibrate(p);}catch(e){} }

// ════════════════════════════════════════════════════════
// HOME STATUS
// ════════════════════════════════════════════════════════
async function loadHomeStatus(){
  try{
    const att = await AGI.Attendance.today();
    const row = att.row;
    const badge = document.getElementById('home-status-badge');
    const timesCard = document.getElementById('home-times-card');
    if(att.punched_in && !att.punched_out){
      badge.className='status-badge status-in';
      badge.innerHTML='&#9654; Working';
    } else if(att.punched_in && att.punched_out){
      badge.className='status-badge status-out';
      badge.innerHTML='&#9632; Punched Out';
    } else {
      badge.className='status-badge status-none';
      badge.innerHTML='&#9643; Not checked in';
    }
    if(row){
      timesCard.style.display='';
      const fmt = ts => ts ? ts.slice(11,16) : '—';
      document.getElementById('home-punch-in').textContent  = fmt(row.punch_in);
      document.getElementById('home-punch-out').textContent = fmt(row.punch_out);
      document.getElementById('home-hours').textContent     = row.total_mins ? (row.total_mins/60).toFixed(1)+' hrs' : '—';
    }
  }catch(e){ console.warn('homeStatus:',e.message); }
}

// ════════════════════════════════════════════════════════
// ATTENDANCE TAB
// ════════════════════════════════════════════════════════
async function loadAttendance(){
  try{
    const att = await AGI.Attendance.today();
    const row = att.row;
    const pi = att.punched_in, po = att.punched_out;
    const statusEl = document.getElementById('att-status-row');
    const timesEl  = document.getElementById('att-times');
    const btnIn    = document.getElementById('btn-punch-in');
    const btnOut   = document.getElementById('btn-punch-out');
    if(statusEl){
      if(!pi)        statusEl.innerHTML='<span style="color:var(--tx2)">Not punched in today</span>';
      else if(!po)   statusEl.innerHTML='<span style="color:var(--a3)">&#9654; Currently Working</span>';
      else           statusEl.innerHTML='<span style="color:var(--mu)">&#9632; Shift Complete</span>';
    }
    if(timesEl && row){
      const fmt = ts => ts ? ts.slice(11,16) : '';
      timesEl.innerHTML=
        (row.punch_in  ? '<div>&#9654; In: <strong style="color:var(--a3)">'+fmt(row.punch_in)+'</strong></div>' : '')+
        (row.punch_out ? '<div>&#9632; Out: <strong style="color:var(--a2)">'+fmt(row.punch_out)+'</strong></div>' : '')+
        (row.total_mins? '<div>Total: <strong style="color:var(--a)">'+( row.total_mins/60).toFixed(1)+' hrs</strong></div>' : '');
    }
    if(btnIn)  { btnIn.disabled  = pi;           btnIn.style.opacity  = pi?'0.4':'1'; }
    if(btnOut) { btnOut.disabled = !pi||po;       btnOut.style.opacity = (!pi||po)?'0.4':'1'; }
  }catch(e){ console.warn('attendance:',e.message); }
}

async function doPunchIn(){
  try{
    await AGI.Attendance.punchIn();
    showFlash('&#9654;','Punched In','Have a great shift!','var(--a3)');
    vibrate([50,30,50]);
    await loadAttendance();
    await loadHomeStatus();
  }catch(e){ showFlash('&#9888;','Error',e.message,'var(--a2)'); }
}

async function doPunchOut(){
  try{
    const r = await AGI.Attendance.punchOut();
    const hrs = r.total_mins?(r.total_mins/60).toFixed(1)+'h':'';
    showFlash('&#9632;','Punched Out','Total: '+hrs,'var(--a)');
    vibrate([50,30,50,30,50]);
    await loadAttendance();
    await loadHomeStatus();
  }catch(e){ showFlash('&#9888;','Error',e.message,'var(--a2)'); }
}

// ════════════════════════════════════════════════════════
// OT & LEAVE MODALS
// ════════════════════════════════════════════════════════
function openOTModal(){
  document.getElementById('ot-date').value=new Date().toISOString().slice(0,10);
  document.getElementById('ot-from').value='';
  document.getElementById('ot-to').value='';
  document.getElementById('ot-desc').value='';
  document.getElementById('m-overtime').style.cssText='display:flex;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;align-items:center;justify-content:center';
}
async function submitOvertime(){
  const date=document.getElementById('ot-date').value;
  const from=document.getElementById('ot-from').value;
  const to=document.getElementById('ot-to').value;
  const desc=document.getElementById('ot-desc').value.trim();
  if(!date||!from||!to){ alert('Date, from and to times required'); return; }
  try{
    await AGI.HR.overtime.submit({date,start_time:from,end_time:to,description:desc});
    document.getElementById('m-overtime').style.display='none';
    showFlash('&#8987;','Overtime Submitted','Pending admin approval','var(--a3)');
  }catch(e){ alert(e.message); }
}
function openLeaveModal(){
  const today=new Date().toISOString().slice(0,10);
  document.getElementById('lv-from').value=today;
  document.getElementById('lv-to').value=today;
  document.getElementById('lv-reason').value='';
  document.getElementById('m-leave').style.cssText='display:flex;position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:9999;align-items:center;justify-content:center';
}
async function submitLeave(){
  const from=document.getElementById('lv-from').value;
  const to=document.getElementById('lv-to').value;
  const type=document.getElementById('lv-type').value;
  const reason=document.getElementById('lv-reason').value.trim();
  if(!from||!to){ alert('Dates required'); return; }
  try{
    await AGI.HR.leave.submit({date_from:from,date_to:to,type,reason});
    document.getElementById('m-leave').style.display='none';
    showFlash('&#9992;','Leave Submitted','Pending admin approval','var(--a4)');
  }catch(e){ alert(e.message); }
}

// ════════════════════════════════════════════════════════
// CAMERA / QR SCANNING
// ════════════════════════════════════════════════════════
let cameraStream=null, scanInterval=null, lastScanned=null, scanCooldown=false;

async function startCamera(){
  try{
    cameraStream = await navigator.mediaDevices.getUserMedia(
      {video:{facingMode:'environment',width:{ideal:640},height:{ideal:640}}}
    );
    const video=document.getElementById('cam-video');
    video.srcObject=cameraStream;
    await video.play();
    setScanStatus('Point camera at a piece QR code','');
    startQRScan();
  }catch(e){ setScanStatus('Camera unavailable — use manual entry below','err'); }
}

function stopCamera(){
  clearInterval(scanInterval); scanInterval=null;
  if(cameraStream){ cameraStream.getTracks().forEach(t=>t.stop()); cameraStream=null; }
}

function startQRScan(){
  clearInterval(scanInterval);
  if('BarcodeDetector' in window){
    const detector=new BarcodeDetector({formats:['qr_code']});
    const video=document.getElementById('cam-video');
    scanInterval=setInterval(async()=>{
      if(scanCooldown||!cameraStream) return;
      try{ const codes=await detector.detect(video); if(codes.length>0) handleQRResult(codes[0].rawValue); }catch(e){}
    },300);
  } else {
    loadJsQR().then(()=>{
      const video=document.getElementById('cam-video');
      const canvas=document.getElementById('cam-canvas');
      const ctx=canvas.getContext('2d');
      scanInterval=setInterval(()=>{
        if(scanCooldown||!cameraStream||!video.videoWidth) return;
        canvas.width=video.videoWidth; canvas.height=video.videoHeight;
        ctx.drawImage(video,0,0);
        const id=ctx.getImageData(0,0,canvas.width,canvas.height);
        const code=window.jsQR&&window.jsQR(id.data,canvas.width,canvas.height);
        if(code&&code.data) handleQRResult(code.data);
      },300);
    });
  }
}

function loadJsQR(){
  return new Promise((res,rej)=>{
    if(window.jsQR){res();return}
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';
    s.onload=res; s.onerror=rej; document.head.appendChild(s);
  });
}

function handleQRResult(rawText){
  if(scanCooldown) return;
  let uid=null;
  // 1. URL format — labels encode https://host/piece/REF-1-RA-1
  const urlMatch = rawText.match(/\/piece\/([^?\s\/]+)/i);
  if(urlMatch){
    uid = decodeURIComponent(urlMatch[1]).toUpperCase();
  } else {
    // 2. JSON format
    try{ const p=JSON.parse(rawText); uid=p.uid||p['PIECE ID']||null; }
    catch{
      // 3. Line format: PIECE ID: REF-1-RA-1
      const m=rawText.match(/PIECE\s*ID[:\s]+([^\n]+)/i);
      uid=m?m[1].trim():rawText.trim().toUpperCase();
    }
  }
  if(!uid||uid===lastScanned) return;
  lastScanned=uid;
  scanCooldown=true;
  setTimeout(()=>{ scanCooldown=false; lastScanned=null; },2500);
  setScanStatus('QR detected: '+uid,'ok');
  lookupPiece(uid);
}

function setScanStatus(msg,cls=''){
  const el=document.getElementById('scan-status');
  el.textContent=msg; el.className='scan-status'+(cls?' '+cls:'');
}

// ════════════════════════════════════════════════════════
// LOOKUP
// ════════════════════════════════════════════════════════
function lookupManual(){
  const uid=document.getElementById('manual-uid').value.trim().toUpperCase();
  if(!uid){ document.getElementById('manual-uid').classList.add('err'); setTimeout(()=>document.getElementById('manual-uid').classList.remove('err'),700); return; }
  document.getElementById('manual-uid').value='';
  lookupPiece(uid);
}

async function lookupPiece(uid){
  try{
    const piece=await AGI.Labels.get(uid);
    scanLog=piece.scanLog||[];
    setScanStatus('Found: '+uid,'ok');
    vibrate([30]);
    // Fetch fresh order data (including attachments) — background cache may be empty
    let orderData = orders.find(o=>o.id===piece.orderId)||null;
    if(!orderData && piece.orderId){
      try{ orderData=await AGI.Orders.get(piece.orderId); }catch(e){}
    }
    renderPieceCard(piece,'',orderData);
  }catch(e){
    setScanStatus('Piece "'+uid+'" not found','err');
    vibrate([50,30,50,30,50]);
    renderPieceCard(null,uid,null);
  }
}

// ════════════════════════════════════════════════════════
// PIECE CARD
// ════════════════════════════════════════════════════════
function renderPieceCard(piece,missingUid='',orderData){
  const container=document.getElementById('piece-result');
  container.style.display='';
  if(!piece){
    container.innerHTML='<div class="piece-card" style="margin:0 16px 16px"><div class="piece-hd"><div>'+
      '<div class="piece-uid" style="color:var(--a2)">'+missingUid+'</div>'+
      '<div style="font-size:.78rem;color:var(--tx2);margin-top:6px">Piece not found in system</div>'+
      '</div></div></div>';
    return;
  }
  const procs=piece.processes||['cutting'];
  const pieceLogs=scanLog.filter(s=>s.pieceUid===piece.uid);
  const myProcs=currentWorker.processes||[];
  const wkName=wid=>{ const w=workers.find(x=>x.id===wid); return w?w.name:'Worker'; };
  const allDone=procs.every(pid=>pieceLogs.some(s=>s.process===pid&&s.action==='done'));
  // Use freshly fetched orderData if provided, otherwise fall back to cache
  const order=orderData||(orders.find(o=>o.id===piece.orderId)||{});
  const cust=customers.find(c=>c.id===order.customerId)||{};
  const cutW=piece.cutW||piece.w, cutH=piece.cutH||piece.h;
  const hasComp=cutW!==piece.w||cutH!==piece.h;
  const glassDesc=[piece.thickness?piece.thickness+'mm':'',piece.color?piece.color:'',piece.glassType?piece.glassType:''].filter(Boolean).join(' ');
  // Attachments — store in global array, onclick passes index only (no data in HTML attrs)
  const atts=Array.isArray(order.attachments)?order.attachments:[];
  _attachments = atts; // store globally so openAttViewer can access by index
  const attHTML=atts.length?'<div style="padding:8px 14px;display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--br)">'+
    atts.map((a,i)=>{
      const label=a.name||'File';
      const mime=a.type||'application/octet-stream';
      const isImg=mime.startsWith('image/');
      const isPdf=mime==='application/pdf';
      const icon=isImg?'&#128247;':isPdf?'&#128196;':'&#128206;';
      return '<button onclick="openAttViewer('+i+')" style="font-size:.72rem;color:var(--a);background:rgba(0,204,255,.08);border:1px solid rgba(0,204,255,.25);border-radius:6px;padding:5px 10px;cursor:pointer;display:inline-flex;align-items:center;gap:4px">'+icon+' '+label+'</button>';
    }).join('')+'</div>':'';

  const procHTML=procs.map(pid=>{
    const doneLog=pieceLogs.filter(s=>s.process===pid&&s.action==='done').slice(-1)[0];
    const isDone=!!doneLog;
    const canAct=myProcs.includes(pid)||myProcs.length===0;
    let rightHTML='';
    if(isDone){
      const d=new Date(doneLog.ts);
      const time=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      const date=d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
      rightHTML='<div style="text-align:right"><div style="color:var(--a3);font-size:1.1rem">&#10003;</div>'+
        '<div style="font-size:.65rem;color:var(--a3);font-family:monospace">'+time+'</div>'+
        '<div style="font-size:.6rem;color:var(--mu)">'+date+'</div>'+
        '<div style="font-size:.6rem;color:var(--tx2)">'+wkName(doneLog.workerId)+'</div></div>';
    } else if(canAct){
      rightHTML='<button class="proc-btn proc-btn-done" data-uid="'+piece.uid+'" data-pid="'+pid+'" data-act="done">Mark Done</button>';
    }
    return '<div class="proc-row '+(isDone?'done-row':'')+'">'+
      '<div class="proc-dot" style="background:'+(isDone?'var(--a3)':'var(--br2)')+'"></div>'+
      '<div style="flex:1"><span class="chip '+procCls(pid)+'">'+procLabel(pid)+'</span></div>'+
      rightHTML+'</div>';
  }).join('');

  container.innerHTML=
    '<div class="piece-card highlight" id="active-piece-card">'+
      '<div class="piece-hd"><div style="flex:1">'+
        '<div class="piece-uid">'+piece.uid+'</div>'+
        '<div class="piece-order" style="font-size:.85rem;font-weight:600;color:var(--a);margin-top:2px">'+(piece.orderNum||'No order')+(piece.code?' &mdash; '+piece.code:'')+'</div>'+
        (cust.name?'<div style="font-size:.75rem;color:var(--tx2);margin-top:2px">'+cust.name+'</div>':'')+
        '<div style="margin-top:4px;font-size:.75rem;color:var(--tx2)">'+glassDesc+'</div>'+
      '</div>'+
      (allDone?'<div style="text-align:right"><div style="font-size:1.4rem;color:var(--a3)">&#10003;</div><div style="font-size:.62rem;color:var(--a3)">Complete</div></div>':'')+
      '</div>'+
      (order.notes?'<div style="font-size:.72rem;color:var(--a4);background:rgba(255,210,63,.07);border:1px solid rgba(255,210,63,.2);border-radius:8px;padding:8px 10px;margin:8px 14px">&#9888; '+order.notes+'</div>':'')+
      attHTML+
      '<div style="background:var(--s1);border-radius:10px;padding:12px 14px;margin:10px 14px;display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
        '<div><div style="font-size:.6rem;color:var(--tx2);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px">Final Size</div>'+
        '<div style="font-family:monospace;font-size:1.05rem;font-weight:700">'+piece.w+' &times; '+piece.h+'</div>'+
        '<div style="font-size:.65rem;color:var(--mu)">mm</div></div>'+
        '<div><div style="font-size:.6rem;color:var(--a4);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px">Cut Size'+(hasComp?' (+comp)':'')+'</div>'+
        '<div style="font-family:monospace;font-size:1.05rem;font-weight:700;color:'+(hasComp?'var(--a4)':'var(--tx)')+'">'+cutW+' &times; '+cutH+'</div>'+
        '<div style="font-size:.65rem;color:var(--mu)">mm</div></div>'+
      '</div>'+
      '<div class="piece-meta">'+
        '<div class="piece-meta-item"><div class="piece-meta-label">Cut Type</div>'+
        '<div class="piece-meta-val" style="color:'+(piece.cutType==='manual'?'var(--a4)':'var(--a3)')+'">'+
        (piece.cutType==='manual'?'Manual':'Machine')+'</div></div>'+
        '<div class="piece-meta-item"><div class="piece-meta-label">Date</div>'+
        '<div class="piece-meta-val mn">'+(piece.date||'—')+'</div></div>'+
      '</div>'+
      '<div class="proc-list">'+procHTML+'</div>'+
    '</div>';

  container.querySelectorAll('.proc-btn').forEach(btn=>{
    btn.onclick=()=>markProcess(btn.dataset.uid,btn.dataset.pid,btn.dataset.act);
  });
  setTimeout(()=>{ const c=document.getElementById('active-piece-card'); if(c) c.classList.remove('highlight'); },600);
}

async function markProcess(uid,pid,act){
  const btn=document.querySelector('.proc-btn[data-uid="'+uid+'"][data-pid="'+pid+'"]');
  if(btn){ btn.disabled=true; btn.textContent='Saving...'; }
  try{
    await AGI.Labels.scan(uid,pid,'done');
  }catch(e){
    if(btn){ btn.disabled=false; btn.textContent='Mark Done'; }
    showFlash('&#9888;','Error','Could not save','var(--a2)');
    return;
  }
  showFlash('&#10003;','Done!',procLabel(pid)+' — '+uid,'var(--a3)');
  vibrate([30,20,30]);
  try{
    const fresh=await AGI.Labels.get(uid);
    scanLog=fresh.scanLog||scanLog;
    let orderData=orders.find(o=>o.id===fresh.orderId)||null;
    if(!orderData && fresh.orderId){ try{ orderData=await AGI.Orders.get(fresh.orderId); }catch(e){} }
    renderPieceCard(fresh,'',orderData);
  }catch(e){
    scanLog=scanLog.filter(s=>!(s.pieceUid===uid&&s.process===pid&&s.action==='done'));
    scanLog.push({workerId:currentWorker.id,workerName:currentWorker.name,pieceUid:uid,process:pid,action:'done',ts:new Date().toISOString()});
    const piece=labelItems.find(l=>l.uid===uid);
    if(piece) renderPieceCard(piece,'',null);
  }
}

// ════════════════════════════════════════════════════════
// HISTORY TAB — with full timestamps and filter
// ════════════════════════════════════════════════════════
function setHistFilter(filter, btn){
  histFilter=filter;
  document.querySelectorAll('.hist-filter-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderHistory();
}

async function renderHistory(){
  try{
    const logs=await AGI.Labels.history({limit:200});
    scanLog=logs;
  }catch(e){ console.warn('history fetch:',e.message); }

  const now=new Date();
  const startOfToday=new Date(now.getFullYear(),now.getMonth(),now.getDate());
  const startOfWeek=new Date(startOfToday); startOfWeek.setDate(startOfToday.getDate()-startOfToday.getDay());

  let filtered=[...scanLog];
  if(histFilter==='today')  filtered=filtered.filter(s=>new Date(s.ts)>=startOfToday);
  else if(histFilter==='week') filtered=filtered.filter(s=>new Date(s.ts)>=startOfWeek);
  filtered=filtered.slice(0,100);

  const listEl=document.getElementById('hist-list');
  const emptyEl=document.getElementById('hist-empty');
  if(!filtered.length){ listEl.innerHTML=''; emptyEl.style.display=''; return; }
  emptyEl.style.display='none';

  // Group by date
  const groups={};
  filtered.forEach(s=>{
    const d=new Date(s.ts);
    const key=d.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
    if(!groups[key]) groups[key]=[];
    groups[key].push(s);
  });

  listEl.innerHTML=Object.entries(groups).map(([dateLabel,items])=>
    '<div class="hist-date-header">'+dateLabel+'</div>'+
    items.map(s=>{
      const d=new Date(s.ts);
      const time=d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      return '<div class="hist-item">'+
        '<div class="hist-uid">'+s.pieceUid+'</div>'+
        '<div class="hist-proc"><span class="chip '+procCls(s.process)+'" style="font-size:.58rem">'+procLabel(s.process)+'</span></div>'+
        '<span class="hist-action '+(s.action||'done')+'">'+(s.action==='start'?'Started':'Done')+'</span>'+
        '<div class="hist-time mn">'+time+'</div>'+
      '</div>';
    }).join('')
  ).join('');
}

// ════════════════════════════════════════════════════════
// QUEUE TAB — with order filter
// ════════════════════════════════════════════════════════
function setQueueFilter(orderNum, btn){
  queueFilter=orderNum;
  document.querySelectorAll('.queue-filter-btn').forEach(b=>b.classList.remove('on'));
  btn.classList.add('on');
  renderQueueFiltered();
}

async function renderQueue(){
  const el=document.getElementById('queue-body');
  el.innerHTML='<div style="text-align:center;padding:30px;color:var(--mu)">Loading...</div>';
  allQueueData=[];
  try{
    const myProcs=currentWorker.processes||[];
    allQueueData=await AGI.Labels.pending(myProcs);
  }catch(e){ console.warn('queue:',e.message); }

  // Build order filter buttons
  const filterRow=document.getElementById('queue-filter-row');
  const orderNums=[...new Set(allQueueData.map(i=>i.orderNum).filter(Boolean))].sort();
  filterRow.innerHTML='<button class="queue-filter-btn '+(queueFilter==='all'?'on':'')+'" data-order="all" onclick="setQueueFilter(\'all\',this)">All Orders</button>'+
    orderNums.map(o=>'<button class="queue-filter-btn '+(queueFilter===o?'on':'')+'" data-order="'+o+'" onclick="setQueueFilter(\''+o+'\',this)">'+o+'</button>').join('');

  renderQueueFiltered();
}

function renderQueueFiltered(){
  const el=document.getElementById('queue-body');
  let data=allQueueData;
  if(queueFilter!=='all') data=data.filter(i=>i.orderNum===queueFilter);

  if(!data.length){
    el.innerHTML='<div class="card" style="margin:12px"><div class="card-body"><div class="empty-msg">&#10003; All caught up!<br>No pending pieces'+(queueFilter!=='all'?' for '+queueFilter:'')+'.</div></div></div>';
    return;
  }
  const byOrder={};
  data.forEach(item=>{ const k=item.orderNum||'Unassigned'; if(!byOrder[k]) byOrder[k]=[]; byOrder[k].push(item); });

  el.innerHTML=Object.entries(byOrder).map(([orderNum,items])=>
    '<div class="card" style="margin:12px 12px 0">'+
      '<div class="card-hd">'+
        '<span class="card-title">'+orderNum+'</span>'+
        '<span style="font-size:.68rem;color:var(--mu)">'+items.length+' piece'+(items.length!==1?'s':'')+'</span>'+
      '</div>'+
      '<div style="padding:0">'+
        items.map(item=>{
          const pending=item.pendingProcs||[];
          return '<div class="hist-item" style="cursor:pointer" onclick="lookupPiece(\''+item.uid+'\');switchTab(\'scan\')">'+
            '<div><div class="hist-uid">'+item.uid+'</div>'+
            '<div style="font-size:.72rem;color:var(--tx2);margin-top:2px">'+item.w+'&times;'+item.h+' &bull; '+item.thickness+'mm</div></div>'+
            '<div style="flex:1;padding:0 10px;display:flex;flex-wrap:wrap;gap:3px">'+
              pending.map(pid=>'<span class="chip '+procCls(pid)+'" style="font-size:.58rem">'+procLabel(pid)+'</span>').join('')+
            '</div>'+
            '<span style="color:var(--mu);font-size:1rem">&#8250;</span>'+
          '</div>';
        }).join('')+
      '</div>'+
    '</div>'
  ).join('')+'<div style="height:12px"></div>';
}
// ═══════════════════════════════════════════════════════
// ATTACHMENT VIEWER
// ═══════════════════════════════════════════════════════
function openAttViewer(idx){
  const a = _attachments[idx];
  if(!a) return;
  const mime = a.type || 'application/octet-stream';
  const raw  = a.data || '';
  const name = a.name || 'File';
  // data field may already be a full data URI or just raw base64 — normalise both
  const isDataURI = raw.startsWith('data:');
  const dataURI   = isDataURI ? raw : ('data:' + mime + ';base64,' + raw);
  const b64only   = isDataURI ? raw.replace(/^data:[^;]+;base64,/, '') : raw;
  _currentAtt = {dataURI, b64only, mime, name};
  const isImg = mime.startsWith('image/');
  const el    = document.getElementById('m-attviewer');
  const img   = document.getElementById('attv-img');
  document.getElementById('attv-name').textContent = name;
  if(isImg){
    img.style.display = '';
    img.src = dataURI;
    el.style.display = 'flex';
  } else {
    // PDF / other — open via blob URL in new tab
    _openBlob(b64only, mime);
  }
}

function _openBlob(b64, mime){
  try {
    const bytes = atob(b64);
    const arr   = new Uint8Array(bytes.length);
    for(let i=0;i<bytes.length;i++) arr[i]=bytes.charCodeAt(i);
    const blob  = new Blob([arr], {type: mime});
    window.open(URL.createObjectURL(blob), '_blank');
  } catch(e) {
    alert('Cannot open file: ' + e.message);
  }
}

function closeAttViewer(){
  document.getElementById('m-attviewer').style.display = 'none';
  document.getElementById('attv-img').src = '';
  _currentAtt = null;
}

function downloadAtt(){
  if(!_currentAtt) return;
  try {
    const bytes = atob(_currentAtt.b64only);
    const arr   = new Uint8Array(bytes.length);
    for(let i=0;i<bytes.length;i++) arr[i]=bytes.charCodeAt(i);
    const blob  = new Blob([arr], {type: _currentAtt.mime});
    const url   = URL.createObjectURL(blob);
    const a     = document.createElement('a');
    a.href     = url;
    a.download = _currentAtt.name;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  } catch(e) {
    alert('Download failed: ' + e.message);
  }
}
