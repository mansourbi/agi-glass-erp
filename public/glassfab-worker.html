<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060c14">
<script src="/agi-api.js"></script>
<title>AGI Glass — Worker</title>
<style>
:root{
  --bg:#060c14; --s1:#0b1522; --s2:#101d2c; --s3:#162436;
  --br:#1a2e45; --br2:#213650;
  --a:#00ccff; --a2:#ff6935; --a3:#36ff8a; --a4:#ffd23f; --a5:#c084fc;
  --tx:#d0e8f5; --tx2:#6a90b0; --mu:#3a5268;
  --r:12px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',sans-serif;color:var(--tx);display:flex;flex-direction:column}

/* ── SCREENS ── */
.screen{display:none;flex-direction:column;height:100%;overflow:hidden}
.screen.on{display:flex}

/* ── LOGIN ── */
#scr-login{background:var(--bg);align-items:center;justify-content:center;padding:40px 24px;
  background-image:radial-gradient(ellipse 80% 50% at 50% 0%,rgba(0,204,255,.07),transparent)}
.login-logo{width:72px;height:72px;margin:0 auto 20px;display:flex;align-items:center;justify-content:center;border-radius:8px;overflow:hidden}
.login-title{font-size:1.8rem;font-weight:700;letter-spacing:2px;text-align:center;color:var(--a);
  font-variant:small-caps;margin-bottom:4px}
.login-sub{font-size:.75rem;color:var(--tx2);text-align:center;margin-bottom:36px;letter-spacing:1px}
.login-box{width:100%;max-width:360px;display:flex;flex-direction:column;gap:14px}
.inp{background:var(--s2);border:1.5px solid var(--br);border-radius:var(--r);
  color:var(--tx);font-size:1rem;padding:14px 16px;outline:none;width:100%;
  transition:border-color .2s;-webkit-appearance:none}
.inp:focus{border-color:var(--a)}
.inp::placeholder{color:var(--mu)}
.inp.err{border-color:#ff5a5a;animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.btn-full{width:100%;padding:16px;background:var(--a);border:none;border-radius:var(--r);
  color:#000;font-size:1rem;font-weight:700;cursor:pointer;letter-spacing:1px;
  transition:all .2s;-webkit-appearance:none}
.btn-full:active{transform:scale(.97);background:#00aadd}
.login-err{color:#ff6464;font-size:.82rem;text-align:center;min-height:18px;letter-spacing:.3px}

/* ── TOP BAR ── */
.topbar{background:rgba(6,12,20,.95);backdrop-filter:blur(20px);
  border-bottom:1px solid var(--br);padding:12px 16px;
  padding-top:calc(12px + env(safe-area-inset-top,0px));
  display:flex;align-items:center;gap:10px;flex-shrink:0;z-index:10}
.topbar-brand{font-size:.75rem;font-weight:700;letter-spacing:2px;color:var(--a);text-transform:uppercase}
.topbar-worker{font-size:.72rem;color:var(--tx2);margin-left:auto}
.topbar-logout{background:none;border:1px solid var(--br);color:var(--mu);
  padding:5px 10px;border-radius:8px;font-size:.65rem;cursor:pointer;letter-spacing:.5px}
.topbar-logout:active{color:var(--a2);border-color:var(--a2)}

/* ── SCROLL BODY ── */
.scroll-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px;
  padding-bottom:calc(24px + var(--safe-b))}

/* ── CARDS ── */
.card{background:var(--s2);border:1px solid var(--br);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.card-hd{background:var(--s1);padding:11px 14px;border-bottom:1px solid var(--br);
  display:flex;align-items:center;justify-content:space-between}
.card-title{font-size:.65rem;letter-spacing:2px;text-transform:uppercase;color:var(--tx2);font-weight:600}
.card-body{padding:14px}

/* ── SCANNER VIEW ── */
#scr-scan .topbar{background:rgba(6,12,20,.97)}
.scan-hero{display:flex;flex-direction:column;align-items:center;padding:24px 16px 16px}
.scan-frame{width:220px;height:220px;border-radius:20px;position:relative;margin-bottom:20px;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.scan-frame video{width:100%;height:100%;object-fit:cover;border-radius:16px}
.scan-frame canvas{display:none}
.scan-corners{position:absolute;inset:0;pointer-events:none}
.sc-corner{position:absolute;width:26px;height:26px;border-color:var(--a);border-style:solid;border-width:0}
.sc-corner.tl{top:8px;left:8px;border-top-width:3px;border-left-width:3px;border-radius:6px 0 0 0}
.sc-corner.tr{top:8px;right:8px;border-top-width:3px;border-right-width:3px;border-radius:0 6px 0 0}
.sc-corner.bl{bottom:8px;left:8px;border-bottom-width:3px;border-left-width:3px;border-radius:0 0 0 6px}
.sc-corner.br{bottom:8px;right:8px;border-bottom-width:3px;border-right-width:3px;border-radius:0 0 6px 0}
.scan-line{position:absolute;left:12px;right:12px;height:2px;background:linear-gradient(90deg,transparent,var(--a),transparent);
  animation:scanline 2s ease-in-out infinite;border-radius:1px;box-shadow:0 0 8px var(--a)}
@keyframes scanline{0%,100%{top:12px;opacity:.6}50%{top:calc(100% - 14px);opacity:1}}
.scan-status{font-size:.78rem;color:var(--tx2);letter-spacing:.5px;text-align:center;margin-bottom:8px;min-height:20px}
.scan-status.ok{color:var(--a3)}
.scan-status.err{color:var(--a2)}
.manual-input-row{display:flex;gap:8px;padding:0 16px 16px}
.manual-input-row .inp{flex:1;font-size:.9rem;padding:12px 14px}
.btn-scan-manual{background:var(--s3);border:1.5px solid var(--br2);color:var(--tx2);
  padding:12px 14px;border-radius:var(--r);font-size:.8rem;cursor:pointer;white-space:nowrap;
  letter-spacing:.5px}
.btn-scan-manual:active{border-color:var(--a);color:var(--a)}

/* ── PIECE RESULT CARD ── */
.piece-card{background:var(--s2);border:1.5px solid var(--br);border-radius:var(--r);
  margin:0 16px 16px;overflow:hidden}
.piece-card.highlight{border-color:var(--a3);box-shadow:0 0 20px rgba(54,255,138,.15);
  animation:popIn .3s ease}
@keyframes popIn{0%{transform:scale(.95);opacity:.5}100%{transform:scale(1);opacity:1}}
.piece-hd{padding:14px 16px;background:var(--s1);border-bottom:1px solid var(--br);
  display:flex;align-items:flex-start;gap:12px}
.piece-uid{font-size:1.2rem;font-weight:700;color:var(--a);letter-spacing:.5px}
.piece-order{font-size:.72rem;color:var(--tx2);margin-top:3px}
.piece-dims{font-size:.85rem;color:var(--a4);margin-top:2px;font-variant-numeric:tabular-nums}
.piece-meta{display:grid;grid-template-columns:1fr 1fr;gap:0;border-bottom:1px solid var(--br)}
.piece-meta-item{padding:10px 14px;border-right:1px solid var(--br)}
.piece-meta-item:nth-child(even){border-right:none}
.piece-meta-label{font-size:.6rem;color:var(--mu);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:3px}
.piece-meta-val{font-size:.85rem;font-variant-numeric:tabular-nums;font-weight:500}

/* ── PROCESS ROWS ── */
.proc-list{padding:10px 0}
.proc-row{display:flex;align-items:center;padding:12px 16px;gap:12px;border-bottom:1px solid var(--br);
  transition:background .15s}
.proc-row:last-child{border-bottom:none}
.proc-row.done-row{opacity:.6}
.proc-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.proc-name{flex:1;font-size:.88rem;font-weight:500}
.proc-worker{font-size:.7rem;color:var(--tx2);margin-top:1px}
.proc-time{font-size:.65rem;color:var(--mu);text-align:right;min-width:64px}
.att-btn{padding:12px 8px;border-radius:10px;border:1.5px solid;font-size:.78rem;font-weight:600;cursor:pointer;transition:all .2s;-webkit-appearance:none;text-align:center}
.att-in{background:rgba(54,255,138,.08);border-color:var(--a3);color:var(--a3)}
.att-in:active{background:rgba(54,255,138,.2)}
.att-out{background:rgba(255,90,90,.08);border-color:#ff5a5a;color:#ff6464}
.att-out:active{background:rgba(255,90,90,.2)}
.att-leave{background:rgba(255,210,63,.08);border-color:var(--a4);color:var(--a4)}
.att-leave:active{background:rgba(255,210,63,.2)}
.att-return{background:rgba(0,204,255,.08);border-color:var(--a);color:var(--a)}
.att-return:active{background:rgba(0,204,255,.2)}
.att-btn:disabled{opacity:.4;cursor:default}
.proc-btn{padding:8px 14px;border-radius:10px;border:1.5px solid;font-size:.72rem;
  font-weight:600;cursor:pointer;letter-spacing:.5px;transition:all .18s;white-space:nowrap}
.proc-btn-start{background:rgba(0,204,255,.08);border-color:var(--a);color:var(--a)}
.proc-btn-start:active{background:rgba(0,204,255,.2);transform:scale(.95)}
.proc-btn-done{background:rgba(54,255,138,.08);border-color:var(--a3);color:var(--a3)}
.proc-btn-done:active{background:rgba(54,255,138,.2);transform:scale(.95)}
.proc-tick{color:var(--a3);font-size:1.1rem}

/* ── HISTORY ── */
#scr-history .card-body{padding:0}
.hist-item{padding:12px 16px;border-bottom:1px solid var(--br);display:flex;align-items:center;gap:10px}
.hist-item:last-child{border-bottom:none}
.hist-uid{font-size:.85rem;font-weight:600;color:var(--a);min-width:100px}
.hist-proc{font-size:.75rem;color:var(--tx2);flex:1}
.hist-action{font-size:.65rem;padding:2px 8px;border-radius:8px}
.hist-action.start{background:rgba(0,204,255,.1);color:var(--a)}
.hist-action.done{background:rgba(54,255,138,.1);color:var(--a3)}
.hist-time{font-size:.62rem;color:var(--mu);text-align:right;min-width:56px}

/* ── BOTTOM NAV ── */
.bottom-nav{background:rgba(6,12,20,.97);border-top:1px solid var(--br);
  display:flex;padding:0;padding-bottom:var(--safe-b);flex-shrink:0}
.bn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:10px 0;cursor:pointer;border:none;background:none;color:var(--mu);
  font-size:.58rem;letter-spacing:1px;text-transform:uppercase;gap:4px;transition:color .15s}
.bn .bni{font-size:1.3rem}
.bn.on{color:var(--a)}
.bn:active{color:var(--tx2)}

/* ── SUCCESS FLASH ── */
.flash-overlay{display:none;position:fixed;inset:0;z-index:500;
  align-items:center;justify-content:center;flex-direction:column;gap:12px;
  background:rgba(6,12,20,.92)}
.flash-overlay.on{display:flex;animation:flashIn .25s ease}
@keyframes flashIn{0%{opacity:0}100%{opacity:1}}
.flash-icon{font-size:5rem;animation:bounce .4s ease}
@keyframes bounce{0%{transform:scale(.5)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
.flash-msg{font-size:1.1rem;font-weight:600;color:var(--tx);letter-spacing:.5px;text-align:center}
.flash-sub{font-size:.8rem;color:var(--tx2);text-align:center}

/* ── CHIPS ── */
.chip{display:inline-flex;align-items:center;padding:3px 8px;border-radius:10px;
  font-size:.62rem;font-weight:600;letter-spacing:.5px;border:1px solid}
.pc-cutting{border-color:rgba(0,204,255,.35);color:var(--a);background:rgba(0,204,255,.08)}
.pc-arrising{border-color:rgba(54,255,138,.35);color:var(--a3);background:rgba(54,255,138,.08)}
.pc-flatpolish{border-color:rgba(54,255,138,.35);color:var(--a3);background:rgba(54,255,138,.08)}
.pc-roundpolish{border-color:rgba(54,255,138,.35);color:var(--a3);background:rgba(54,255,138,.08)}
.pc-bevel{border-color:rgba(54,255,138,.35);color:var(--a3);background:rgba(54,255,138,.08)}
.pc-drilling{border-color:rgba(255,210,63,.35);color:var(--a4);background:rgba(255,210,63,.08)}
.pc-tempering{border-color:rgba(255,105,53,.35);color:var(--a2);background:rgba(255,105,53,.08)}
.pc-laminating{border-color:rgba(192,132,252,.35);color:var(--a5);background:rgba(192,132,252,.08)}
.pc-paint{border-color:rgba(255,105,53,.35);color:var(--a2);background:rgba(255,105,53,.08)}
.pc-sandblasting{border-color:rgba(255,210,63,.35);color:var(--a4);background:rgba(255,210,63,.08)}
.pc-poly{border-color:rgba(192,132,252,.35);color:var(--a5);background:rgba(192,132,252,.08)}
.pc-igu{border-color:rgba(0,204,255,.35);color:var(--a);background:rgba(0,204,255,.08)}

/* ── UTILS ── */
.mn{font-variant-numeric:tabular-nums}
.empty-msg{text-align:center;padding:40px 20px;color:var(--mu);font-size:.82rem;line-height:1.8}
</style>
</head>

<!-- SCREEN: HOME -->
<!-- ═══════════════════════════════════════════════ -->
<div class="screen" id="scr-home">
  <div class="topbar">
    <div class="topbar-brand">AGI Glass</div>
    <div class="topbar-worker" id="worker-name-home"></div>
    <button class="topbar-logout" onclick="doLogout()">Logout</button>
  </div>
  <div style="flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px">
    <!-- Attendance card — Punch In / Punch Out -->
    <div id="att-card" style="background:var(--s2);border:1px solid var(--br);border-radius:var(--r);padding:16px">
      <div style="font-size:.65rem;letter-spacing:1.5px;color:var(--tx2);text-transform:uppercase;margin-bottom:10px">&#9654; Attendance</div>
      <div id="att-status-row" style="font-size:1rem;font-weight:600;margin-bottom:12px;color:var(--tx)">Loading...</div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <button id="btn-punch-in"  class="att-btn att-in"  onclick="doPunchIn()"  disabled>&#9654; Punch In</button>
        <button id="btn-punch-out" class="att-btn att-out" onclick="doPunchOut()" disabled>&#9632; Punch Out</button>
      </div>
      <div id="att-times" style="margin-top:10px;font-size:.72rem;color:var(--tx2);line-height:1.8"></div>
    </div>
    <!-- Quick actions -->
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
      <button onclick="switchTab('scan')" style="background:var(--a);border:none;border-radius:var(--r);padding:18px 12px;color:#000;font-weight:700;font-size:.9rem;cursor:pointer">
        &#9906;<br><span style="font-size:.75rem;font-weight:600">Scan QR</span>
      </button>
      <button onclick="switchTab('queue')" style="background:var(--s2);border:1px solid var(--br);border-radius:var(--r);padding:18px 12px;color:var(--tx);font-weight:600;font-size:.9rem;cursor:pointer">
        &#9741;<br><span style="font-size:.75rem">My Queue</span>
      </button>
      <button onclick="openOTModal()" style="background:var(--s2);border:1px solid var(--br);border-radius:var(--r);padding:18px 12px;color:var(--tx);font-weight:600;font-size:.9rem;cursor:pointer">
        &#8987;<br><span style="font-size:.75rem">Log Overtime</span>
      </button>
      <button onclick="openLeaveModal()" style="background:var(--s2);border:1px solid var(--br);border-radius:var(--r);padding:18px 12px;color:var(--tx);font-weight:600;font-size:.9rem;cursor:pointer">
        &#9992;<br><span style="font-size:.75rem">Leave Request</span>
      </button>
    </div>
  </div>
  <nav class="bottom-nav">
    <button class="bn on" id="bnh-home" onclick="switchTab('home')"><span class="bni">&#8962;</span>Home</button>
    <button class="bn" id="bnh-scan" onclick="switchTab('scan')"><span class="bni">&#9906;</span>Scan</button>
    <button class="bn" id="bnh-history" onclick="switchTab('history')"><span class="bni">&#128203;</span>History</button>
    <button class="bn" id="bnh-queue" onclick="switchTab('queue')"><span class="bni">&#9741;</span>Queue</button>
  </nav>

<script>
// ════════════════════════════════════════════════════════
// PROCESS DEFINITIONS (mirrors desktop app)
// ════════════════════════════════════════════════════════
// Safe localStorage shim for any remaining references
const DB = {
  l(k,def){try{const v=localStorage.getItem('agi_'+k);return v!==null?JSON.parse(v):def}catch{return def}},
  s(k,v){try{localStorage.setItem('agi_'+k,JSON.stringify(v))}catch(e){}}
};
const PROC_MAP = {
  cutting:    {label:'Cutting',     cls:'pc-cutting'},
  arrising:   {label:'Arrising',    cls:'pc-arrising'},
  flatpolish: {label:'Flat Polish', cls:'pc-flatpolish'},
  roundpolish:{label:'Round Polish',cls:'pc-roundpolish'},
  bevel:      {label:'Bevelling',   cls:'pc-bevel'},
  drilling:   {label:'Drilling',    cls:'pc-drilling'},
  tempering:  {label:'Tempering',   cls:'pc-tempering'},
  laminating: {label:'Laminating',  cls:'pc-laminating'},
  paint:      {label:'Paint',       cls:'pc-paint'},
  sandblasting:{label:'Sand Blasting',cls:'pc-sandblasting'},
  poly:       {label:'Poly',        cls:'pc-poly'},
  igu:        {label:'IGU',         cls:'pc-igu'},
};
function procLabel(pid){return (PROC_MAP[pid]||{label:pid}).label}
function procCls(pid){return (PROC_MAP[pid]||{cls:'pc-cutting'}).cls}

// ════════════════════════════════════════════════════════
// ════════════════════════════════════════════════════════
// DATA LAYER — AGI Glass API
// ════════════════════════════════════════════════════════
let workers    = [];
let labelItems = [];
let scanLog    = [];
let orders     = [];
let customers  = [];
let currentWorker = null;

// Generate a stable pseudo-device-ID stored in localStorage
function getDeviceId(){
  let did = localStorage.getItem('gfw_device_id');
  if(!did){
    did = 'DEV-' + Math.random().toString(36).slice(2,8).toUpperCase() + '-' + Date.now().toString(36).toUpperCase();
    localStorage.setItem('gfw_device_id', did);
  }
  return did;
}

async function doLogin(){
  const email = document.getElementById('l-email').value.trim().toLowerCase();
  const pass  = document.getElementById('l-pass').value;
  const errEl = document.getElementById('l-err');
  errEl.textContent = '';
  if(!email || !pass){ errEl.textContent = 'Enter email and password.'; return; }
  try{
    const worker = await AGI.Auth.login(email, pass);
    currentWorker = worker;

    // ── Device binding check ──────────────────────────────
    const deviceId = getDeviceId();
    let deviceOk = false;
    try{
      const res = await fetch('/api/workers/'+worker.id+'/register-device', {
        method: 'POST',
        headers: { 'Content-Type':'application/json', 'Authorization':'Bearer '+AGI.getToken() },
        body: JSON.stringify({ device_id: deviceId })
      }).then(r=>r.json());

      if(res.status === 'approved'){
        deviceOk = true;
      } else if(res.status === 'pending'){
        errEl.innerHTML = '⏳ <strong>Device pending approval.</strong><br>Ask your admin to approve this device in Settings → Workers → Device tab.';
        AGI.Auth.logout(); currentWorker = null;
        return;
      } else if(res.status === 'rejected' || res.error){
        errEl.innerHTML = '✗ <strong>Device not authorized.</strong><br>' + (res.error || 'This account is bound to a different device.');
        AGI.Auth.logout(); currentWorker = null;
        return;
      } else {
        // First registration — pending
        errEl.innerHTML = '⏳ <strong>Device registered — pending approval.</strong><br>Ask your admin to approve this device.';
        AGI.Auth.logout(); currentWorker = null;
        return;
      }
    }catch(de){
      // If device endpoint fails (network/server issue) — allow login but warn
      console.warn('[device check failed]', de.message);
      deviceOk = true;
    }

    if(!deviceOk) return;
    sessionStorage.setItem('gfw_session', JSON.stringify({id:worker.id, ts:Date.now()}));
    await startSession();
  }catch(e){
    console.error('[login error]', e);
    errEl.textContent = e.message || 'Login failed - check email and password';
    ['l-email','l-pass'].forEach(id=>document.getElementById(id).classList.add('err'));
    setTimeout(()=>['l-email','l-pass'].forEach(id=>document.getElementById(id).classList.remove('err')),1500);
  }
}

function doLogout(){
  sessionStorage.removeItem('gfw_session');
  AGI.Auth.logout();
  currentWorker = null;
  stopCamera();
  showScreen('login');
  document.getElementById('l-pass').value = '';
  document.getElementById('l-err').textContent = '';
}

async function restoreSession(){
  try{
    const s = JSON.parse(sessionStorage.getItem('gfw_session')||'null');
    if(!s) return false;
    if(Date.now()-s.ts > 12*60*60*1000){ sessionStorage.removeItem('gfw_session'); return false; }
    if(!AGI.getToken()) return false;
    const res = await AGI.Auth.me();
    currentWorker = res.worker;
    return true;
  }catch{ return false; }
}

async function startSession(){
  try{
    [labelItems, workers] = await Promise.all([AGI.Labels.list(), AGI.Workers.list()]);
    // Load orders in background for order details
    AGI.Orders.list().then(list=>
      Promise.all(list.map(o=>AGI.Orders.get(o.id)))
    ).then(full=>{ orders=full; }).catch(()=>{});
    AGI.Customers.list().then(list=>{ customers=list; }).catch(()=>{});
  }catch(e){ console.warn('[startSession]', e.message); }
  ['worker-name-display','worker-name-hist','worker-name-queue','worker-name-home'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.textContent = currentWorker.name;
  });
  showScreen('home');
  switchTab('home');
}

// ════════════════════════════════════════════════════════
// SCREEN / TAB NAVIGATION
// ════════════════════════════════════════════════════════
function showFlash(icon, title, msg, color){
  let el=document.getElementById('wk-flash');
  if(!el){ el=document.createElement('div'); el.id='wk-flash';
    el.style.cssText='position:fixed;top:20px;left:50%;transform:translateX(-50%);z-index:9999;background:var(--bg);border:2px solid;border-radius:12px;padding:12px 20px;text-align:center;min-width:200px;max-width:80vw;box-shadow:0 4px 20px rgba(0,0,0,.5);transition:opacity .4s';
    document.body.appendChild(el);
  }
  el.style.borderColor=color||'var(--a)';
  el.style.color=color||'var(--a)';
  el.style.opacity='1';
  el.innerHTML='<div style="font-size:1.4rem">'+icon+'</div><div style="font-weight:700;margin:4px 0">'+title+'</div><div style="font-size:.8rem;opacity:.8">'+msg+'</div>';
  clearTimeout(el._t);
  el._t=setTimeout(()=>{ el.style.opacity='0'; },2500);
}

function showToast(msg){
  showFlash('&#9632;','',msg,'var(--a)');
}

function vibrate(pattern){
  try{ if(navigator.vibrate) navigator.vibrate(pattern); }catch(e){}
}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('on'));
  document.getElementById('scr-'+id).classList.add('on');
}

function switchTab(tab){
  stopCamera();
  ['home','scan','history','queue'].forEach(t=>{
    const s=document.getElementById('scr-'+t);
    if(s) s.classList.remove('on');
  });
  const target=document.getElementById('scr-'+tab);
  if(target) target.classList.add('on');
  // Update all nav buttons across all screens (prefixed bnh-, bns-, etc.)
  document.querySelectorAll('.bn').forEach(btn=>{
    const id=btn.id||'';
    const btnTab=id.replace(/^bn[a-z]*-/,'');
    btn.classList.toggle('on', btnTab===tab);
  });
  if(tab==='scan') startCamera();
  if(tab==='history') renderHistory();
  if(tab==='queue') renderQueue();
  if(tab==='home') loadAttendance();
}

// ════════════════════════════════════════════════════════
// CAMERA / QR SCANNING
// ════════════════════════════════════════════════════════
let cameraStream = null;
let scanInterval = null;
let lastScanned  = null;
let scanCooldown = false;

async function startCamera(){
  try{
    const constraints = {
      video:{facingMode:'environment',width:{ideal:640},height:{ideal:640}}
    };
    cameraStream = await navigator.mediaDevices.getUserMedia(constraints);
    const video = document.getElementById('cam-video');
    video.srcObject = cameraStream;
    await video.play();
    setScanStatus('Point camera at a piece QR code','');
    startQRScan();
  }catch(e){
    setScanStatus('Camera unavailable — use manual entry below','err');
    console.warn('Camera error:',e);
  }
}

function stopCamera(){
  clearInterval(scanInterval);
  scanInterval = null;
  if(cameraStream){
    cameraStream.getTracks().forEach(t=>t.stop());
    cameraStream = null;
  }
}

function startQRScan(){
  clearInterval(scanInterval);
  // Use BarcodeDetector if available (Android Chrome)
  if('BarcodeDetector' in window){
    const detector = new BarcodeDetector({formats:['qr_code']});
    const video = document.getElementById('cam-video');
    scanInterval = setInterval(async()=>{
      if(scanCooldown||!cameraStream) return;
      try{
        const codes = await detector.detect(video);
        if(codes.length>0) handleQRResult(codes[0].rawValue);
      }catch(e){}
    },300);
  } else {
    // Fallback: draw video to canvas, send to jsQR (dynamically load)
    loadJsQR().then(()=>{
      const video  = document.getElementById('cam-video');
      const canvas = document.getElementById('cam-canvas');
      const ctx    = canvas.getContext('2d');
      scanInterval = setInterval(()=>{
        if(scanCooldown||!cameraStream||!video.videoWidth) return;
        canvas.width  = video.videoWidth;
        canvas.height = video.videoHeight;
        ctx.drawImage(video,0,0);
        const imageData = ctx.getImageData(0,0,canvas.width,canvas.height);
        const code = window.jsQR&&window.jsQR(imageData.data,canvas.width,canvas.height);
        if(code&&code.data) handleQRResult(code.data);
      },300);
    });
  }
}

function loadJsQR(){
  return new Promise((res,rej)=>{
    if(window.jsQR){res();return}
    const s=document.createElement('script');
    s.src='https://cdnjs.cloudflare.com/ajax/libs/jsQR/1.4.0/jsQR.min.js';
    s.onload=res; s.onerror=rej;
    document.head.appendChild(s);
  });
}

function handleQRResult(rawText){
  if(scanCooldown) return;
  // Parse the QR — try JSON first, then URL, then line-by-line, then treat as plain UID
  let uid = null;
  try{
    const parsed = JSON.parse(rawText);
    uid = parsed.uid || parsed['PIECE ID'] || null;
  }catch{
    // URL format: https://host/piece/UID
    const urlMatch = rawText.match(/\/piece\/([^\s?#]+)/i);
    if(urlMatch){ uid = decodeURIComponent(urlMatch[1]).trim().toUpperCase(); }
    else{
      // Line-by-line format: "PIECE ID: XXX-1-1\n..."
      const match = rawText.match(/PIECE\s*ID[:\s]+([^\n]+)/i);
      if(match) uid = match[1].trim();
      else uid = rawText.trim(); // treat whole string as UID
    }
  }
  if(!uid) return;
  if(uid === lastScanned) return; // debounce same code
  lastScanned = uid;
  // Detect remnant plate scan (starts with REM-)
  if(uid.startsWith('REM-')){ lookupRemnant(uid); return; }
  scanCooldown = true;
  setTimeout(()=>{ scanCooldown=false; lastScanned=null; }, 2500);
  setScanStatus('QR detected: '+uid,'ok');
  lookupPiece(uid);
}

function setScanStatus(msg,cls=''){
  const el=document.getElementById('scan-status');
  el.textContent=msg; el.className='scan-status'+(cls?' '+cls:'');
}

    // 404 or network error
  }

// PIECE CARD
// ════════════════════════════════════════════════════════
function renderPieceCard(piece, missingUid=''){
  const container = document.getElementById('piece-result');
  container.style.display='';

  if(!piece){
    container.innerHTML=
      '<div class="piece-card" style="margin:0 16px 16px">'+
        '<div class="piece-hd"><div>'+
          '<div class="piece-uid" style="color:var(--a2)">'+missingUid+'</div>'+
          '<div class="piece-order" style="color:var(--a2)">Piece not found in system</div>'+
          '<div style="font-size:.75rem;color:var(--tx2);margin-top:6px">This piece ID is not registered.<br>Make sure cutting optimization has been run in the desktop app.</div>'+
        '</div></div>'+
      '</div>';
    container.classList.add('highlight');
    setTimeout(()=>container.classList.remove('highlight'),600);
    return;
  }

  // Piece processes and scan log
  const procs    = piece.processes || ['cutting'];
  const pieceLogs= scanLog.filter(s=>s.pieceUid===piece.uid);
  const myProcs  = currentWorker.processes || [];
  const wkName   = wid=>{ const w=workers.find(x=>x.id===wid); return w?w.name:'Worker'; };
  const allDone  = procs.every(pid=>pieceLogs.some(s=>s.process===pid&&s.action==='done'));

  // Order + customer
  const order = orders.find(o=>o.id===piece.orderId) || {};
  const cust  = customers.find(c=>c.id===order.customerId) || {};
  const atts  = order.attachments || [];

  // Glass description
  const glassDesc = [
    piece.thickness ? piece.thickness+'mm' : '',
    piece.color ? piece.color.charAt(0).toUpperCase()+piece.color.slice(1) : '',
    piece.glassType ? piece.glassType.charAt(0).toUpperCase()+piece.glassType.slice(1) : '',
  ].filter(Boolean).join(' ');

  // Dimensions
  const cutW = piece.cutW || piece.w;
  const cutH = piece.cutH || piece.h;
  const hasComp = cutW !== piece.w || cutH !== piece.h;

  // Build process rows — Mark Done only
  const procHTML = procs.map(pid=>{
    const doneLog = pieceLogs.filter(s=>s.process===pid&&s.action==='done').slice(-1)[0];
    const isDone  = !!doneLog;
    const canAct  = myProcs.includes(pid) || myProcs.length===0;
    const dot     = isDone ? 'var(--a3)' : 'var(--br2)';

    let rightHTML = '';
    if(isDone){
      const doneDate = new Date(doneLog.ts);
      const dateStr  = doneDate.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});
      const timeStr  = doneDate.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      rightHTML =
        '<div style="text-align:right">'+
          '<div style="color:var(--a3);font-size:1.1rem">&#10003;</div>'+
          '<div style="font-size:.65rem;color:var(--a3);font-family:monospace">'+timeStr+'</div>'+
          '<div style="font-size:.6rem;color:var(--mu)">'+dateStr+'</div>'+
          '<div style="font-size:.6rem;color:var(--tx2)">'+wkName(doneLog.workerId)+'</div>'+
        '</div>';
    } else if(canAct){
      rightHTML = '<button class="proc-btn proc-btn-done" data-uid="'+piece.uid+'" data-pid="'+pid+'" data-act="done">Mark Done</button>';
    }

    return '<div class="proc-row '+(isDone?'done-row':'')+'">'+
      '<div class="proc-dot" style="background:'+dot+'"></div>'+
      '<div style="flex:1">'+
        '<span class="chip '+procCls(pid)+'">'+procLabel(pid)+'</span>'+
      '</div>'+
      rightHTML+
    '</div>';
  }).join('');

  // Build attachments HTML
  let attHTML = '';
  if(atts.length){
    attHTML='<div style="margin-bottom:8px;display:flex;gap:6px;flex-wrap:wrap">';
    atts.forEach(a=>{
      const fn = a.filename||a.name||'';
      const label = a.originalName||a.name||'Attachment';
      attHTML+='<a href="/uploads/'+fn+'" target="_blank" style="font-size:.7rem;color:var(--a);background:rgba(0,204,255,.08);border:1px solid rgba(0,204,255,.2);border-radius:6px;padding:4px 8px;text-decoration:none">&#128206; '+label+'</a>';
    });
    attHTML+='</div>';
  }

  container.innerHTML=
    '<div class="piece-card highlight" id="active-piece-card">'+
      // Header
      '<div class="piece-hd">'+
        '<div style="flex:1">'+
          '<div class="piece-uid">'+piece.uid+'</div>'+
          '<div class="piece-order" style="font-size:.85rem;font-weight:600;color:var(--a);margin-top:2px">'+(piece.orderNum||'No order')+(piece.code?' &mdash; '+piece.code:'')+'</div>'+
          (cust.name?'<div style="font-size:.75rem;color:var(--tx2);margin-top:2px">&#128100; '+cust.name+'</div>':'')+
          (order.extref?'<div style="font-size:.7rem;color:var(--mu);margin-top:1px">Ref: '+order.extref+'</div>':'')+
          '<div style="margin-top:6px;font-size:.75rem;color:var(--tx2)">'+glassDesc+'</div>'+
        '</div>'+
        '<div style="text-align:right">'+
          (allDone?'<div style="font-size:1.4rem;color:var(--a3)">&#10003;</div><div style="font-size:.62rem;color:var(--a3);margin-top:2px">Complete</div>':'')+
        '</div>'+
      '</div>'+
      // Order notes
      (order.notes?'<div style="font-size:.72rem;color:var(--a4);background:rgba(255,210,63,.07);border:1px solid rgba(255,210,63,.2);border-radius:8px;padding:8px 10px;margin-bottom:8px">&#9888; '+order.notes+'</div>':'')+
      // Attachments
      attHTML+
      // Dimensions
      '<div style="background:var(--s1);border-radius:10px;padding:12px 14px;margin:0 0 10px;display:grid;grid-template-columns:1fr 1fr;gap:8px">'+
        '<div>'+
          '<div style="font-size:.6rem;color:var(--tx2);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px">Final Size</div>'+
          '<div style="font-family:monospace;font-size:1.05rem;font-weight:700;color:var(--tx)">'+piece.w+' &times; '+piece.h+'</div>'+
          '<div style="font-size:.65rem;color:var(--mu)">mm</div>'+
        '</div>'+
        '<div>'+
          '<div style="font-size:.6rem;color:var(--a4);letter-spacing:1px;text-transform:uppercase;margin-bottom:3px">Cut Size'+(hasComp?' (+comp)':'')+'</div>'+
          '<div style="font-family:monospace;font-size:1.05rem;font-weight:700;color:'+(hasComp?'var(--a4)':'var(--tx)')+'">'+cutW+' &times; '+cutH+'</div>'+
          '<div style="font-size:.65rem;color:var(--mu)">mm</div>'+
        '</div>'+
      '</div>'+
      // Meta
      '<div class="piece-meta">'+
        '<div class="piece-meta-item"><div class="piece-meta-label">Cut Type</div>'+
          '<div class="piece-meta-val" style="color:'+(piece.cutType==='manual'?'var(--a4)':'var(--a3)')+'">'+(piece.cutType==='manual'?'Manual':'Machine')+'</div></div>'+
        '<div class="piece-meta-item"><div class="piece-meta-label">Date</div>'+
          '<div class="piece-meta-val mn">'+(piece.date||'—')+'</div></div>'+
        (piece.bevelMM?'<div class="piece-meta-item"><div class="piece-meta-label">Bevel</div><div class="piece-meta-val">'+piece.bevelMM+'cm</div></div>':'')+
      '</div>'+
      // Processes
      '<div class="proc-list">'+procHTML+'</div>'+
    '</div>';

  // Add event listeners for process buttons (avoid inline onclick with complex args)
  container.querySelectorAll('.proc-btn').forEach(btn=>{
    btn.onclick=()=>markProcess(btn.dataset.uid, btn.dataset.pid, btn.dataset.act);
  });

  setTimeout(()=>{
    const card=document.getElementById('active-piece-card');
    if(card) card.classList.remove('highlight');
  },600);
}


async function markProcess(uid, pid, act){
  const pieceUid = uid;

  // Disable button immediately
  const btn = document.querySelector('.proc-btn[data-uid="'+pieceUid+'"][data-pid="'+pid+'"]');
  if(btn){ btn.disabled=true; btn.textContent='Saving...'; }

  try{
    await AGI.Labels.scan(pieceUid, pid, 'done');
  }catch(e){
    console.error('[scan]',e.message);
    vibrateErr();
    if(btn){ btn.disabled=false; btn.textContent='Mark Done'; }
    showFlash('&#9888;', 'Error', 'Could not save', 'var(--a2)');
    return;
  }

  showFlash('&#10003;', 'Done!', procLabel(pid)+' — '+pieceUid, 'var(--a3)');
  vibrate([30,20,30]);

  // Fetch fresh data from API — this gives us the real DB scan log
  try{
    const fresh = await AGI.Labels.get(pieceUid);
    // fresh.scanLog comes from GET /api/labels/:uid which joins scan_log
    scanLog = fresh.scanLog || scanLog;
    const idx = labelItems.findIndex(l=>l.uid===pieceUid);
    if(idx>=0) labelItems[idx]={...labelItems[idx], ...fresh};
    renderPieceCard(fresh);
  }catch(e){
    // Fallback: update locally
    scanLog = scanLog.filter(s=>!(s.pieceUid===pieceUid&&s.process===pid&&s.action==='done'));
    scanLog.push({ workerId:currentWorker.id, workerName:currentWorker.name,
      pieceUid, process:pid, action:'done', ts:new Date().toISOString() });
    const piece = labelItems.find(l=>l.uid===pieceUid);
    if(piece) renderPieceCard(piece);
  }
}

function importData(input){
  const file = input.files[0]; if(!file) return;
  const reader = new FileReader();
  reader.onload = e=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!data._version||!data.workers){
        setImportStatus('Invalid AGI Glass backup file.','err'); return;
      }
      // Merge — don't overwrite, just add missing
      workers    = data.workers    || [];
      labelItems = data.labelItems || [];
      // Keep existing scanLog (local worker activity)
      if(!scanLog.length) scanLog = data.scanLog || [];
      persist();
      setImportStatus(`Imported: ${workers.length} workers, ${labelItems.length} labels.`,'ok');
    }catch(e){
      setImportStatus('Failed to read file: '+e.message,'err');
    }
    input.value='';
  };
  reader.readAsText(file);
}

function setImportStatus(msg, type){
  const el=document.getElementById('import-status');
  el.textContent=msg;
  el.style.color=type==='ok'?'var(--a3)':'var(--a2)';
}

// ════════════════════════════════════════════════════════
// UTILS
// ════════════════════════════════════════════════════════
function fmtTime(ts){
  if(!ts) return '';
  try{
    const d=new Date(ts);
    const now=new Date();
    const diffMs=now-d;
    const diffMin=Math.floor(diffMs/60000);
    if(diffMin<1) return 'just now';
    if(diffMin<60) return diffMin+'m ago';
    if(diffMin<1440) return Math.floor(diffMin/60)+'h ago';
    return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
  }catch{return ''}
}

// ════════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════════
// Keyboard: enter on password triggers login
document.getElementById('l-pass').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()});
document.getElementById('l-email').addEventListener('keydown',e=>{if(e.key==='Enter')document.getElementById('l-pass').focus()});
document.getElementById('manual-uid').addEventListener('keydown',e=>{if(e.key==='Enter')lookupManual()});

// Restore session if still valid
(async()=>{
  const ok = await restoreSession();
  if(ok){ await startSession(); }
  else  { showScreen('login'); }
})();
</script>
